components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          title: 用户
        product:
          allOf:
            - $ref: "#/components/schemas/Product"
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 数量
        is_selected:
          type: boolean
          title: 是否选中
        price_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: 价格快照
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 加入时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
        is_deleted:
          type: boolean
          readOnly: true
          title: 软删除
      required:
        - created_at
        - customer
        - id
        - is_deleted
        - price_snapshot
        - product
        - updated_at
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 分类名称
          maxLength: 32
        sort:
          type: integer
          maximum: 32767
          minimum: -32768
          title: 排序
        is_show:
          type: boolean
          title: 是否显示
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
        is_deleted:
          type: boolean
          readOnly: true
          title: 软删除
      required:
        - created_at
        - id
        - is_deleted
        - name
        - updated_at
    Coupon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 优惠券名称
          maxLength: 64
        type:
          allOf:
